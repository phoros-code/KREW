[project]
name = "everyday-buddy"
version = "0.1.0"
description = "Everyday Buddy — local-first, multi-agent AI assistant (buddy-core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "crewai>=0.100.0",
  "ollama>=0.4.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sse-starlette>=2.1.0",
  "mss>=9.0.0",
  "pillow>=11.0.0",
  "opencv-python>=4.8.0",
]

[project.optional-dependencies]
voice = [
  "openwakeword>=0.6.0",
  "faster-whisper>=1.0.0",
  "piper-tts>=1.2.0",
]
browser = [
  "playwright>=1.44.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pip-audit>=2.7.0",
]

[project.scripts]
buddy = "buddy_core.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buddy_core*", "voice*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
