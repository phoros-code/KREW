name: everyday_buddy
description: Everyday Buddy phone companion — local-first control for the laptop agent.
publish_to: "none"
version: 0.2.1+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3 # SHA-256 cert pinning in BuddyApi (SECURITY.md TLS)
  flutter_secure_storage: ^9.0.0
  flutter_blue_plus: ^2.3.12
  permission_handler: ^11.0.0 # BLE scan/connect runtime permission (Track A5.9)
  mjpeg_stream: ^1.0.0
  package_info_plus: ^8.0.0 # Settings → About app version (Track C3)
  intl: ^0.20.2 # flutter_localizations pin (Track C3 i18n scaffold)
  flutter_localizations: # Track C3 i18n scaffold (English only)
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
