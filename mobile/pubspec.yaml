name: everyday_buddy
description: Everyday Buddy phone companion — local-first control for the laptop agent.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3 # SHA-256 cert pinning in BuddyApi (SECURITY.md TLS)
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  flutter_blue_plus: ^2.3.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
