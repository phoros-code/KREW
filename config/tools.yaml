shell:
  allowlist:
    - "git *"
    - "python -m pytest*"
    - "py -m pytest*"
    - "ls *"
    - "dir *"
    - "cat *"
    - "type *"
    - "echo *"
    - "ollama list*"
    - "ollama show*"
  denylist:               # checked first, always wins over allowlist
    - "rm -rf*"
    - "rmdir /s*"
    - "del /f*"
    - "*format*"
    - "dd *"
    - "mkfs*"
    - ":(){ :|:& };:"     # fork bomb
    - "*shutdown*"
    - "*powershell*Remove-Item*"
files:
  workspace_root: "~/buddy-workspace"
web_search:
  backend: "duckduckgo"   # or "searxng"
  searxng_url: ""          # required if backend is searxng
agent_limits:
  max_plan_steps: 20
  max_recursion_depth: 2
  tool_timeout_seconds: 30
memory:                       # Track B3: bounded agent-state store (own block, safe defaults)
  path: "logs/memory.jsonl"   # repo-relative unless absolute; agent summaries only, never raw file contents
  cap: 500                    # max entries; oldest evicted first
browser:                      # Track B5: Playwright-backed browser automation (deny-all by default)
  allowed_domains: []         # operator opts in per-domain, e.g. ["example.com"] (covers subdomains)
# No automation.enabled key by decision (review N4): a toggle nothing reads
# is false assurance. focus_check is read-only; type_text/press_keys are
# consent-gated stubs regardless.
